<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabadiwala Connect</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#166534">
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f0fdf4;color:#14532d}
header{background:#166534;color:#fff;padding:12px;text-align:center}
main{padding:12px;max-width:520px;margin:auto}
.card{background:#fff;border:1px solid #bbf7d0;border-radius:10px;padding:12px;margin:10px 0}
button{background:#166534;color:#fff;border:0;border-radius:8px;padding:12px;width:100%;font-size:17px}
input,select{width:100%;padding:10px;margin:6px 0;font-size:16px;box-sizing:border-box}
nav{display:flex;position:sticky;bottom:0;background:#fff;border-top:1px solid #bbf7d0}
nav button{background:none;color:#166534;flex:1;border-radius:0}
.row{display:flex;justify-content:space-between;padding:4px 0}
.off{color:#b45309;font-weight:bold}
img{max-width:100%;border-radius:8px}
</style>
</head>
<body>
<header><b>♻ Kabadiwala Connect</b><br><small id="net">online</small></header>
<main>
<section id="s-price" class="card"><h3>💰 भाव (Price Board)</h3><div id="prices">…</div></section>
<section id="s-lot" class="card" hidden><h3>📦 नया Lot (New Lot)</h3>
<input type="file" id="photo" accept="image/*" capture="environment">
<img id="prev" hidden>
<select id="mat"></select>
<input id="wt" type="number" step="0.1" placeholder="वज़न kg (weight)">
<button onclick="saveLot()">Estimate + Save</button><div id="est"></div></section>
<section id="s-ledger" class="card" hidden><h3>📒 हिसाब (Ledger)</h3><div id="ledger">…</div></section>
</main>
<nav>
<button onclick="show('s-price')">भाव</button>
<button onclick="show('s-lot')">+ Lot</button>
<button onclick="show('s-ledger')">हिसाब</button>
</nav>
<script src="app.js"></script>
</body>
</html>
